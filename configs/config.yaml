
# California Housing MLOps Configuration

data:
  input_path: data/california_housing.csv
  target_column: MedHouseValue

split:
  test_size: 0.2
  random_state: 42

model:
  type: RandomForestRegressor
  n_estimators: 200
  max_depth: null
  random_state: 42

paths:
  model_output: models/random_forest_model.joblib
  metrics_output: reports/metrics.json